version: '3.8'

services:
  mongodb:
    image: mongo:6
    container_name: workstation_mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: freelancing_marketplace

  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    container_name: workstation_server
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/freelancing_marketplace
      JWT_SECRET: production_jwt_secret_key_change_me
      JWT_REFRESH_SECRET: production_refresh_jwt_secret_change_me
      NODE_ENV: production
      CLIENT_URL: http://localhost
    depends_on:
      - mongodb

  client:
    build:
      context: .
      dockerfile: docker/client.Dockerfile
    container_name: workstation_client
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - server

volumes:
  mongo_data:
