<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 44" fill="none">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#001740" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- White Rounded Square Behind Logo -->
  <rect x="2" y="2" width="40" height="40" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow)" />

  <!-- Logo Mark -->
  <image href="data:image/png;base64," x="2" y="7" width="39" height="30" />

  <!-- Typography -->
  <text x="54" y="26" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" fill="#002366" letter-spacing="-0.5">Work<tspan fill="#0A84FF">Station</tspan></text>
  <text x="55" y="37" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="7.5" fill="#0A84FF" letter-spacing="1.5">FIND. HIRE. BUILD.</text>
</svg>
